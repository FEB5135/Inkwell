<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="Kendi hanzi havuzunu kur, aralıklı tekrarla ezberle.">
<title>Inkwell</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app" id="app">

  <!-- ══════════════ ÇALIŞ ══════════════ -->
  <section class="screen" id="screen-study" data-screen="study">

    <!-- oturum dışı: özet -->
    <div class="view" id="study-home">
      <header class="page-head">
        <h1 class="wordmark"><img src="icons/icon-192.png" alt="" width="34" height="34">Inkwell</h1>
        <p class="subtitle" data-i18n="study.greeting">Bugünün tekrarı</p>
      </header>

      <div class="queue-grid">
        <div class="queue-stat queue-stat--new">
          <span class="queue-num" id="count-pool">0</span>
          <span class="queue-label" data-i18n="count.cards">kart</span>
        </div>
        <div class="queue-stat queue-stat--learn">
          <span class="queue-num" id="count-today">0</span>
          <span class="queue-label" data-i18n="count.today">bugün</span>
        </div>
        <div class="queue-stat queue-stat--due">
          <span class="queue-num" id="count-mature">0</span>
          <span class="queue-label" data-i18n="count.mature">yerleşmiş</span>
        </div>
      </div>

      <div class="deck-picker">
        <label class="field-label" for="study-deck" data-i18n="study.deck">Deste</label>
        <select id="study-deck" class="select"></select>
      </div>

      <label class="field-label" data-i18n="study.what">Ne çalışacaksın</label>
      <div class="modes" id="modes"></div>

      <button class="btn btn--primary btn--xl" id="btn-start" data-i18n="study.start">Çalışmaya başla</button>

      <p class="empty-note" id="study-empty" hidden></p>

      <div class="mini-stats" id="mini-stats"></div>
    </div>

    <!-- oturum içi: kart -->
    <div class="view" id="study-session" hidden>
      <div class="session-bar">
        <button class="icon-btn" id="btn-quit" data-i18n-aria="study.quit" aria-label="Oturumu bitir">✕</button>
        <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="session-left" id="session-left">0</span>
      </div>

      <div class="card-stage">
        <span class="card-type" id="card-type"></span>

        <!-- ön yüz -->
        <div class="card-face" id="card-front"></div>

        <!-- yazılan cevap -->
        <div class="answer-box" id="answer-box" hidden>
          <input type="text" id="answer-input" class="answer-input" autocomplete="off"
                 autocorrect="off" autocapitalize="off" spellcheck="false"
                 inputmode="latin" enterkeyhint="done">
          <p class="answer-hint" id="answer-hint"></p>
        </div>

        <!-- kalemle yazma -->
        <div class="write-box" id="write-box" hidden>
          <div class="write-grid" id="write-grid"></div>
          <p class="write-status" id="write-status"></p>
          <div class="write-actions">
            <button class="btn btn--ghost btn--sm" id="btn-write-hint" data-i18n="write.hint">İpucu</button>
            <button class="btn btn--ghost btn--sm" id="btn-write-give" data-i18n="write.giveUp">Bilmiyorum</button>
          </div>
        </div>

        <!-- değerlendirme -->
        <p class="answer-verdict" id="answer-verdict" hidden></p>

        <!-- arka yüz -->
        <div class="card-back" id="card-back" hidden></div>

        <!-- Yalnız doğru cevaptan sonra çıkar: bir karakteri havuzdan
             çekmeye ancak bildiğini gösterdikten sonra karar verilebilir. -->
        <button class="btn btn--ghost btn--sm learn-btn" id="btn-learned" hidden></button>
      </div>

      <div class="card-actions">
        <button class="btn btn--primary btn--xl" id="btn-reveal" data-i18n="study.reveal">Göster</button>
        <button class="btn btn--primary btn--xl btn--next" id="btn-next" hidden>
          <span data-i18n="study.next">Sonraki</span> <span aria-hidden="true">→</span>
        </button>
      </div>
    </div>

    <!-- oturum sonu -->
    <div class="view view--center" id="study-done" hidden>
      <div class="seal">成</div>
      <h2 data-i18n="study.done">Oturum bitti</h2>
      <p class="muted" id="done-summary"></p>
      <button class="btn btn--ghost" id="btn-done-back" data-i18n="study.back">Geri dön</button>
    </div>
  </section>

  <!-- ══════════════ EKLE ══════════════ -->
  <section class="screen" id="screen-add" data-screen="add" hidden>
    <header class="page-head">
      <h1 data-i18n="add.title">Ekle</h1>
      <p class="subtitle" data-i18n="add.subtitle">Sözlükten ara ya da toplu yapıştır</p>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab is-active" data-addtab="search" role="tab" data-i18n="add.tabSearch">Sözlükten</button>
      <button class="tab" data-addtab="bulk" role="tab" data-i18n="add.tabBulk">Toplu yapıştır</button>
      <button class="tab" data-addtab="manual" role="tab" data-i18n="add.tabManual">Elle</button>
    </div>

    <!-- Deste seçimi üç sekmenin de üstünde duruyor: hangisinden eklersen
         ekle kayıt bu desteye gider. Tek deste varken açılır kutu gereksiz
         yer kapladığı için tek satıra iniyor. -->
    <div class="deck-picker" id="deck-picker">
      <div class="deck-compact" id="deck-compact" hidden>
        <span id="deck-compact-text"></span>
        <button class="linkish" id="btn-new-deck-compact" data-i18n="add.newDeck">+ Yeni deste</button>
      </div>
      <div id="deck-full" hidden>
        <label class="field-label" for="add-deck" data-i18n="add.deckLabel">Eklenecek deste</label>
        <div class="row">
          <select id="add-deck" class="select"></select>
          <button class="btn btn--ghost btn--sm" id="btn-new-deck" data-i18n="add.newDeckShort">+ Yeni</button>
        </div>
      </div>
    </div>

    <!-- sözlük araması -->
    <div class="addpane" id="addpane-search">
      <input type="search" id="dict-q" class="input input--lg" data-i18n-ph="add.searchPh"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <p class="hint" data-i18n-html="add.searchHint"></p>
      <div class="dict-status" id="dict-status"></div>
      <ul class="results" id="dict-results"></ul>
    </div>

    <!-- toplu -->
    <div class="addpane" id="addpane-bulk" hidden>
      <textarea id="bulk-text" class="textarea" rows="9" spellcheck="false"></textarea>
      <p class="hint" data-i18n-html="add.bulkHint"></p>
      <div class="row row--end">
        <button class="btn btn--ghost" id="btn-bulk-preview" data-i18n="add.preview">Önizle</button>
        <button class="btn btn--primary" id="btn-bulk-add" data-i18n="add.add" disabled>Ekle</button>
      </div>
      <ul class="results" id="bulk-preview"></ul>
    </div>

    <!-- elle -->
    <div class="addpane" id="addpane-manual" hidden>
      <label class="field-label" for="m-hanzi" data-i18n="add.hanzi">Karakter</label>
      <input id="m-hanzi" class="input input--hanzi">
      <label class="field-label" for="m-pinyin" data-i18n="add.pinyin">Pinyin</label>
      <input id="m-pinyin" class="input" autocapitalize="off" spellcheck="false">
      <label class="field-label" for="m-meaning" data-i18n="add.meaning">Anlam</label>
      <input id="m-meaning" class="input">
      <button class="btn btn--primary" id="btn-manual-add" data-i18n="add.add">Ekle</button>
    </div>
  </section>

  <!-- ══════════════ HAVUZ ══════════════ -->
  <section class="screen" id="screen-browse" data-screen="browse" hidden>
    <header class="page-head">
      <h1 data-i18n="browse.title">Havuz</h1>
      <p class="subtitle" id="browse-count"></p>
    </header>

    <div class="row">
      <select id="browse-deck" class="select"></select>
      <input type="search" id="browse-q" class="input" data-i18n-ph="browse.search">
    </div>

    <!-- Kayda dokununca seçilir. Yanlış bölüme eklenmiş bir karakteri doğru
         desteye taşımanın tek yolu bu; taşıma kartları ve zamanlamayı bozmaz. -->
    <div class="bulk-bar" id="browse-bulk" hidden>
      <span class="bulk-count" id="browse-picked"></span>
      <button class="linkish" id="btn-browse-all" data-i18n="browse.selectAll">Tümü</button>
      <select id="browse-move" class="select"></select>
      <button class="btn btn--ghost btn--sm" id="btn-browse-move" data-i18n="browse.move">Taşı</button>
      <button class="btn btn--ghost btn--sm" id="btn-browse-learn"></button>
      <button class="icon-btn" id="btn-browse-clear" data-i18n-aria="browse.clearPick">✕</button>
    </div>

    <ul class="notes" id="notes-list"></ul>
    <p class="empty-note" id="browse-empty" data-i18n="browse.empty" hidden></p>
  </section>

  <!-- ══════════════ AYARLAR ══════════════ -->
  <section class="screen" id="screen-settings" data-screen="settings" hidden>
    <header class="page-head">
      <h1 data-i18n="set.title">Ayarlar</h1>
    </header>

    <div class="setting-group">
      <h2 class="group-title" data-i18n="set.language">Dil</h2>
      <select id="opt-lang" class="select"></select>
    </div>

    <div class="setting-group">
      <h2 class="group-title" data-i18n="set.theme">Görünüm</h2>
      <div class="segmented" id="opt-theme" role="group">
        <button class="segment" data-theme-pick="system" data-i18n="set.themeSystem">Sistem</button>
        <button class="segment" data-theme-pick="light" data-i18n="set.themeLight">Açık</button>
        <button class="segment" data-theme-pick="dark" data-i18n="set.themeDark">Koyu</button>
      </div>
    </div>

    <div class="setting-group">
      <h2 class="group-title" data-i18n="set.cardTypes">Kart türleri</h2>
      <p class="hint" data-i18n="set.cardTypesHint"></p>
      <label class="check"><input type="checkbox" id="opt-type-pinyin" checked>
        <span><b data-i18n="type.pinyin">Okunuş</b><i data-i18n="set.typePinyinDesc"></i></span></label>
      <label class="check"><input type="checkbox" id="opt-type-meaning" checked>
        <span><b data-i18n="type.meaning">Anlam</b><i data-i18n="set.typeMeaningDesc"></i></span></label>
      <label class="check"><input type="checkbox" id="opt-type-recall" checked>
        <span><b data-i18n="type.recall">Üretim</b><i data-i18n="set.typeRecallDesc"></i></span></label>
      <label class="check"><input type="checkbox" id="opt-type-write">
        <span><b data-i18n="type.write">Yazma</b><i data-i18n="set.typeWriteDesc"></i></span></label>
    </div>

    <div class="setting-group">
      <h2 class="group-title" data-i18n="set.sound">Ses</h2>
      <label class="check"><input type="checkbox" id="opt-tts">
        <span><b data-i18n="set.tts">Karakteri seslendir</b><i data-i18n="set.ttsDesc"></i></span></label>
      <p class="hint" id="tts-status"></p>
      <!-- Çince ses verisi kurulu değilse: cihazın TTS ayarlarını açar. -->
      <button class="btn btn--ghost btn--sm" id="btn-tts-install" data-i18n="set.ttsInstall" hidden>Ses paketi kur</button>
    </div>

    <div class="setting-group">
      <h2 class="group-title" data-i18n="set.backup">Yedek</h2>
      <p class="hint" data-i18n="set.backupHint"></p>
      <div class="row">
        <button class="btn btn--ghost" id="btn-export" data-i18n="set.export">Dışa aktar</button>
        <button class="btn btn--ghost" id="btn-import" data-i18n="set.import">İçe aktar</button>
      </div>
      <!-- accept="application/json" değil: Android'in dosya seçicisi .json'u
           çoğu zaman octet-stream sayıp gizliyor, yedek seçilemez oluyordu.
           Süzgeç yerine içeriğe bakılıyor; yedek olmayan dosya zaten
           okunurken anlaşılıyor. -->
      <input type="file" id="import-file" hidden>
      <p class="hint" id="backup-status"></p>
      <p class="hint" id="storage-status"></p>
    </div>

    <div class="setting-group">
      <h2 class="group-title" data-i18n="set.decks">Desteler</h2>
      <p class="hint" data-i18n="add.deckExplain"></p>
      <ul class="deck-list" id="deck-list"></ul>
    </div>

    <p class="colophon" id="colophon"></p>
  </section>

  <!-- ══════════════ ALT GEZİNME ══════════════ -->
  <nav class="tabbar" id="tabbar">
    <button class="tabbar-btn is-active" data-goto="study">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-7a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h7z"/></svg>
      <span data-i18n="nav.study">Çalış</span>
      <em class="badge" id="tab-badge" hidden></em>
    </button>
    <button class="tabbar-btn" data-goto="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="nav.add">Ekle</span>
    </button>
    <button class="tabbar-btn" data-goto="browse">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span data-i18n="nav.browse">Havuz</span>
    </button>
    <button class="tabbar-btn" data-goto="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span data-i18n="nav.settings">Ayarlar</span>
    </button>
  </nav>

</div>

<!-- Tarayıcının prompt/confirm kutuları uygulamanın dışında duruyor: kendi
     yazı tipimiz, kendi rengimiz yok. Aynı işi kağıdın üstünde yapan tek bir
     diyalog var; metin soran da onaylatan da bu. -->
<dialog class="dialog" id="dialog">
  <form method="dialog" class="dialog-card">
    <h2 class="dialog-title" id="dialog-title"></h2>
    <p class="dialog-text" id="dialog-text" hidden></p>
    <input class="input" id="dialog-input" autocapitalize="off" hidden>
    <div class="dialog-actions">
      <button type="button" class="btn btn--ghost" id="dialog-cancel"></button>
      <button type="submit" class="btn btn--primary" id="dialog-ok" value="ok"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="js/vendor/hanzi-writer.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
